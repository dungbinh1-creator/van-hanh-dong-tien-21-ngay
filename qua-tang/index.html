<style>
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:"Be Vietnam Pro",system-ui,sans-serif;color:#1A2233;background:#FBF7F0 radial-gradient(120% 70% at 50% 0%,#FFF6E2 0%,#FBF7F0 50%,#F2EAD8 100%) fixed;min-height:100vh}
.wf-top{position:sticky;top:env(safe-area-inset-top,0px);z-index:60;background:rgba(251,247,240,.92);backdrop-filter:blur(14px);border-bottom:1px solid rgba(11,42,91,.12);font-family:"Be Vietnam Pro",system-ui,sans-serif}
.wf-wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;height:72px;width:min(1160px,100% - 32px);margin-inline:auto}
.wf-logo img{display:block;width:230px;height:auto}
.wf-nav{display:flex;gap:24px;font-size:14.5px;font-weight:500}
.wf-nav a{text-decoration:none;color:#3b4457;transition:color .3s}
.wf-nav a:hover,.wf-nav a.on{color:#1E4FA3}
.wf-nav a.on{font-weight:600}
.wf-btn{position:relative;isolation:isolate;display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 22px;border-radius:999px;font-weight:700;font-size:14.5px;text-decoration:none;color:#0B2A5B;overflow:hidden;white-space:nowrap;
  background:linear-gradient(110deg,#C89B3C 0%,#E6C98A 100%);text-shadow:0 1px 0 rgba(255,250,235,.45);
  box-shadow:0 10px 28px -10px rgba(184,135,46,.7);transition:transform .35s cubic-bezier(.2,.8,.2,1),box-shadow .35s,filter .35s}
.wf-btn::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.75) 48%,transparent 62%);transform:translateX(-120%);animation:wfSheen 3.6s ease-in-out infinite}
.wf-btn:hover,.wf-btn:focus-visible{transform:translateY(-3px) scale(1.02);filter:saturate(1.1) brightness(1.06);box-shadow:0 0 0 2px rgba(230,201,138,.6),0 0 24px 5px rgba(230,201,138,.7),0 0 50px 10px rgba(200,155,60,.45);animation:wfGlow 1.6s ease-in-out infinite;outline:none}
.wf-btn:focus-visible{outline:2px solid #C89B3C;outline-offset:3px}
@keyframes wfGlow{0%,100%{box-shadow:0 0 0 2px rgba(230,201,138,.6),0 0 24px 5px rgba(230,201,138,.7),0 0 50px 10px rgba(200,155,60,.45)}50%{box-shadow:0 0 0 3px rgba(230,201,138,.85),0 0 34px 9px rgba(230,201,138,.85),0 0 70px 16px rgba(200,155,60,.55)}}
@keyframes wfSheen{0%,55%{transform:translateX(-120%)}100%{transform:translateX(120%)}}
@media (max-width:1120px){.wf-nav{display:none}}
@media (max-width:520px){.wf-wrap{height:64px}.wf-logo img{width:168px}.wf-btn{min-height:40px;padding:0 16px;font-size:13.5px}}
@media (prefers-reduced-motion:reduce){.wf-btn,.wf-btn::after{animation:none}}
main{width:min(1120px,100% - 32px);margin-inline:auto;padding:clamp(22px,4vh,44px) 0 48px}
.head{text-align:center;margin-bottom:clamp(18px,3.5vh,34px)}
.eyebrow{display:inline-block;font-size:12.5px;letter-spacing:.18em;text-transform:uppercase;font-weight:700;color:#C89B3C}
h1{font-family:"Fraunces",Georgia,serif;font-weight:600;font-size:clamp(30px,4.4vw,48px);line-height:1.1;margin:8px 0 0;color:#0B2A5B}
h1 em{font-style:italic;color:#1E4FA3}
.gifts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(16px,2.4vw,30px);margin-inline:auto;width:min(100%,max(660px,(100vh - 320px)*2.25 + 60px))}
.gift{display:flex;flex-direction:column;align-items:stretch;gap:16px}
.gift-cover{display:block;border-radius:18px;padding:3px;background:linear-gradient(135deg,#E7C67C,#C89B3C 40%,#1E4FA3);box-shadow:0 0 0 1px rgba(255,255,255,.4) inset,0 24px 50px -24px rgba(11,42,91,.55);transition:transform .45s cubic-bezier(.2,.8,.2,1),box-shadow .45s}
.gift-cover img{display:block;width:100%;height:auto;border-radius:15px}
.gift-cover:hover,.gift-cover:focus-visible{transform:translateY(-6px);box-shadow:0 0 34px rgba(231,198,124,.7),0 30px 60px -24px rgba(11,42,91,.6)}
.gift-btn{min-height:54px;font-size:16px;gap:8px}
.gift-btn svg{width:18px;height:18px;flex:none}
@media (max-width:760px){.gifts{width:auto;grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:78%;overflow-x:auto;scroll-snap-type:x mandatory;margin-inline:-16px;padding:0 16px 14px;scroll-padding-inline:16px}.gift{scroll-snap-align:start}}
</style>
</head>

</div></header>

      <a class="gift-cover" href="/cong-cu/"><img src="/assets/qua-tang-cong-cu.webp" alt="Bìa Bộ công cụ tài chính: Nhìn rõ con số, vững từ tâm thức" width="900" height="1200" fetchpriority="high"></a>

      <a class="wf-btn gift-btn" href="/ebook/">Đọc ebook <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>
